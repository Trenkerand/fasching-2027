services:
  - type: web
    name: fasching-2027
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: fasching-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GMX_EMAIL
        sync: false
      - key: GMX_APP_PASSWORD
        sync: false
      - key: GMX_IMAP_HOST
        value: imap.gmx.net
      - key: GMX_IMAP_PORT
        value: 993
      - key: GMX_SMTP_HOST
        value: mail.gmx.net
      - key: GMX_SMTP_PORT
        value: 587
      - key: AUTO_REFRESH_MINUTES
        value: 5